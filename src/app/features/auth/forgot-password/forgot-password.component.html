<div class="auth-page">
  <aside class="auth-page__side">
    <a class="auth-page__side-brand" routerLink="/">QuickCare</a>
    <h2 class="auth-page__side-title">Esqueceu sua senha? Sem problema.</h2>
    <p class="auth-page__side-text">
      Informe o e-mail da sua conta e enviaremos um código para você criar uma
      nova senha.
    </p>
  </aside>

  <div class="auth-page__main">
    <a class="auth-page__mobile-brand" routerLink="/">QuickCare</a>

    <div class="auth-page__content">
      <div class="auth-page__panel">
        <h1 class="auth-page__title">Recuperar senha</h1>
        <p class="auth-page__subtitle">
          Digite o e-mail cadastrado na sua conta.
        </p>

        <form [formGroup]="form" (ngSubmit)="submit()">
          <ui-grid>
            <ui-grid-item [xs]="12">
              <ui-input
                label="E-mail"
                type="email"
                formControlName="email"
                autocomplete="username"
                [required]="true"
                [maxLength]="150"
                [errorMessage]="fieldError()"
              ></ui-input>
            </ui-grid-item>

            <ui-grid-item [xs]="12">
              <ui-button
                type="submit"
                [fullWidth]="true"
                [loading]="isSubmitting()"
                >Enviar código</ui-button
              >
            </ui-grid-item>
          </ui-grid>
        </form>

        <p class="auth-page__footer">
          Lembrou a senha? <a routerLink="/login">Voltar ao login</a>
        </p>
      </div>
    </div>
  </div>
</div>
