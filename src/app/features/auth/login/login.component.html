<ui-auth-layout
  sideTitle="Atendimento de saúde sob demanda, sem enrolação"
  sideText="Acompanhe suas solicitações, propostas e atendimentos em um só lugar, com profissionais validados e prontos para te atender."
  [sideItems]="['Propostas de profissionais validados em minutos', 'Histórico completo dos seus atendimentos', 'Seus dados protegidos do início ao fim']"
>
  <h1 class="auth-layout__title">Entrar no QuickCare</h1>
  <p class="auth-layout__subtitle">Acesse sua conta para continuar.</p>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <ui-grid>
      <ui-grid-item [xs]="12">
        <ui-input
          label="E-mail"
          type="email"
          formControlName="email"
          autocomplete="username"
          [required]="true"
          [maxLength]="150"
          [errorMessage]="fieldError('email')"
        ></ui-input>
      </ui-grid-item>

      <ui-grid-item [xs]="12">
        <ui-input
          label="Senha"
          type="password"
          formControlName="password"
          [revealable]="true"
          autocomplete="current-password"
          [required]="true"
          [maxLength]="72"
          [errorMessage]="fieldError('password')"
        ></ui-input>
      </ui-grid-item>
      <ui-grid-item [xs]="12">
        <a routerLink="/esqueci-senha">Esqueci minha senha</a>
      </ui-grid-item>
      <ui-grid-item [xs]="12">
        <ui-button
          type="submit"
          [fullWidth]="true"
          [loading]="isSubmitting()"
          >Entrar</ui-button
        >
      </ui-grid-item>
    </ui-grid>
  </form>

  <p class="auth-layout__footer">
    Não tem conta? <a routerLink="/cadastro">Cadastre-se</a>
  </p>
</ui-auth-layout>
