<div class="auth-page">
  <div class="auth-page__panel">
    <h1 class="auth-page__title">Recuperar Senha</h1>
    <p class="auth-page__subtitle">
      Informe o e-mail cadastrado na sua conta do QuickCare para receber o link de redefinição.
    </p>

    @if (successMessage) {
      <div class="alert alert-success">
        {{ successMessage }}
      </div>
    }

    @if (errorMessage) {
      <div class="alert alert-danger">
        {{ errorMessage }}
      </div>
    }

    <form class="auth-page__form" [formGroup]="recoveryForm" (ngSubmit)="onSubmit()">
      <ui-input
        label="E-mail"
        type="email"
        formControlName="email"
        placeholder="exemplo@email.com"
        [required]="true"
        [errorMessage]="fieldError('email')"
      ></ui-input>

      <ui-button
        type="submit"
        [fullWidth]="true"
        [loading]="isLoading"
        [disabled]="recoveryForm.invalid"
      >
        Enviar Link de Recuperação
      </ui-button>
    </form>

    <p class="auth-page__footer">
      Lembrou a senha? <a routerLink="/login">Voltar para o Login</a>
    </p>
  </div>
</div>
