<ui-auth-layout
  sideTitle="Uma plataforma, dois jeitos de cuidar"
  sideText="De um lado, pacientes que precisam de atendimento rápido. Do outro, profissionais prontos para atender. Escolha seu perfil e comece agora."
  [sideItems]="['Pacientes encontram profissionais validados em minutos', 'Profissionais preenchem a agenda com atendimentos reais', 'Cadastro simples, rápido e gratuito']"
  panel="wide"
>
  <h1 class="auth-layout__title">Como você quer se cadastrar?</h1>
  <p class="auth-layout__subtitle">Escolha o tipo de conta para continuar.</p>

  <div class="register-select__options">
    <a class="register-select__option" routerLink="/cadastro/paciente">
      <ui-card [interactive]="true">
        <h2 class="register-select__option-title">Sou paciente</h2>
        <p class="register-select__option-description">
          Quero solicitar atendimento com um profissional de saúde.
        </p>
      </ui-card>
    </a>

    <a class="register-select__option" routerLink="/cadastro/profissional">
      <ui-card [interactive]="true">
        <h2 class="register-select__option-title">Sou profissional de saúde</h2>
        <p class="register-select__option-description">Quero atender solicitações e enviar propostas.</p>
      </ui-card>
    </a>
  </div>

  <p class="auth-layout__footer">Já tem conta? <a routerLink="/login">Entrar</a></p>
</ui-auth-layout>
