<div class="auth-page">
  <div class="auth-page__panel">
    <h1 class="auth-page__title">Criar Nova Senha</h1>
    <p class="auth-page__subtitle">
      Crie uma nova senha segura para acessar sua conta no QuickCare.
    </p>

    @if (errorMessage) {
      <div class="alert alert-danger">
        {{ errorMessage }}
      </div>
    }

    <form class="auth-page__form" [formGroup]="resetForm" (ngSubmit)="onSubmit()">
      <ui-input
        label="Nova Senha"
        type="password"
        formControlName="password"
        [required]="true"
        [errorMessage]="fieldError('password')"
      ></ui-input>

      <ui-input
        label="Confirmar Nova Senha"
        type="password"
        formControlName="confirmPassword"
        [required]="true"
        [errorMessage]="fieldError('confirmPassword')"
      ></ui-input>

      <ui-button
        type="submit"
        [fullWidth]="true"
        [loading]="isLoading"
        [disabled]="resetForm.invalid"
      >
        Redefinir Senha
      </ui-button>
    </form>

    <p class="auth-page__footer">
      Lembrou sua senha? <a routerLink="/login">Voltar para o Login</a>
    </p>
  </div>
</div>
