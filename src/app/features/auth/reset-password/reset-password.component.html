<div class="auth-page">
  <aside class="auth-page__side">
    <a class="auth-page__side-brand" routerLink="/">QuickCare</a>
    <h2 class="auth-page__side-title">Crie uma nova senha</h2>
    <p class="auth-page__side-text">
      Use o código que enviamos por e-mail. Ele vale por tempo limitado.
    </p>
  </aside>

  <div class="auth-page__main">
    <a class="auth-page__mobile-brand" routerLink="/">QuickCare</a>

    <div class="auth-page__content">
      <div class="auth-page__panel">
        <h1 class="auth-page__title">Redefinir senha</h1>
        <p class="auth-page__subtitle">
          Digite o código recebido e escolha uma nova senha.
        </p>

        <form [formGroup]="form" (ngSubmit)="submit()">
          <ui-grid>
            <ui-grid-item [xs]="12">
              <ui-input
                label="E-mail"
                type="email"
                formControlName="email"
                autocomplete="username"
                [required]="true"
                [maxLength]="150"
                [errorMessage]="fieldError('email')"
              ></ui-input>
            </ui-grid-item>

            <ui-grid-item [xs]="12">
              <ui-input
                label="Código"
                type="text"
                formControlName="token"
                autocomplete="one-time-code"
                [required]="true"
                [errorMessage]="fieldError('token')"
              ></ui-input>
            </ui-grid-item>

            <ui-grid-item [xs]="12">
              <ui-input
                label="Nova senha"
                type="password"
                formControlName="password"
                autocomplete="new-password"
                [required]="true"
                [maxLength]="72"
                [errorMessage]="fieldError('password')"
              ></ui-input>
            </ui-grid-item>

            <ui-grid-item [xs]="12">
              <ui-input
                label="Confirmar nova senha"
                type="password"
                formControlName="confirmPassword"
                autocomplete="new-password"
                [required]="true"
                [maxLength]="72"
                [errorMessage]="fieldError('confirmPassword')"
              ></ui-input>
            </ui-grid-item>

            <ui-grid-item [xs]="12">
              <ui-button
                type="submit"
                [fullWidth]="true"
                [loading]="isSubmitting()"
                >Redefinir senha</ui-button
              >
            </ui-grid-item>
          </ui-grid>
        </form>

        <p class="auth-page__footer">
          Não recebeu o código?
          <a routerLink="/esqueci-senha">Enviar novamente</a>
        </p>
      </div>
    </div>
  </div>
</div>
