<ui-confirm-dialog
  [open]="open()"
  titleText="Sua sessão expirou"
  [message]="message()"
  icon="alert"
  confirmLabel="Sim, entrar"
  cancelLabel="Não, cancelar"
  [loading]="isSubmitting()"
  (confirmed)="submit()"
  (closed)="cancel()"
>
  <form [formGroup]="form" (ngSubmit)="submit()" autocomplete="off">
    <ui-input
      label="Senha"
      type="password"
      formControlName="password"
      autocomplete="current-password"
      [revealable]="true"
      [required]="true"
      [maxLength]="72"
      [errorMessage]="fieldError('password')"
    ></ui-input>
  </form>
</ui-confirm-dialog>
