<section class="patient-history">
  <header class="patient-history__header">
    <div>
      <h1 class="patient-history__title">Histórico de solicitações</h1>
      <p class="patient-history__subtitle">Solicitações encerradas: concluídas ou canceladas.</p>
    </div>
  </header>

  @switch (viewState()) {
    @case ('loading') {
      <ui-grid>
        @for (i of [1, 2, 3]; track i) {
          <ui-grid-item [xs]="12">
            <ui-card>
              <div class="patient-history__skeleton-lines">
                <ui-skeleton height="20px" width="40%"></ui-skeleton>
                <ui-skeleton height="16px" width="70%"></ui-skeleton>
                <ui-skeleton height="64px"></ui-skeleton>
              </div>
            </ui-card>
          </ui-grid-item>
        }
      </ui-grid>
    }
    @case ('empty') {
      <ui-empty-state
        title="Nenhuma solicitação encerrada"
        message="Solicitações concluídas ou canceladas aparecerão aqui."
      ></ui-empty-state>
    }
    @case ('error') {
      <ui-error-state (retry)="load()"></ui-error-state>
    }
    @case ('filled') {
      <ui-grid>
        @for (request of requests(); track request.id) {
          <ui-grid-item [xs]="12">
            <app-request-card [request]="request"></app-request-card>
          </ui-grid-item>
        }
      </ui-grid>
    }
  }
</section>
