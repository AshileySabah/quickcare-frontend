<section class="patient-history">
  <header class="patient-history__header">
    <div>
      <h1 class="patient-history__title">Histórico de solicitações</h1>
      <p class="patient-history__subtitle">Solicitações encerradas: concluídas ou canceladas.</p>
    </div>
  </header>

  @switch (viewState()) {
    @case ('loading') {
      <ui-skeleton-list></ui-skeleton-list>
    }
    @case ('empty') {
      <ui-empty-state
        title="Nenhuma solicitação encerrada"
        message="Solicitações concluídas ou canceladas aparecerão aqui."
      ></ui-empty-state>
    }
    @case ('error') {
      <ui-error-state (retry)="load()"></ui-error-state>
    }
    @case ('filled') {
      <ui-list-filters [filters]="filters" [noun]="{ one: 'solicitação', other: 'solicitações' }">
        <ui-grid>
          @for (request of filters.page.items(); track request.id) {
            <ui-grid-item [xs]="12">
              <app-request-card [request]="request" [canRequestAgain]="true" [blocked]="!!blocked()"></app-request-card>
            </ui-grid-item>
          }
        </ui-grid>
      </ui-list-filters>
    }
  }
</section>
