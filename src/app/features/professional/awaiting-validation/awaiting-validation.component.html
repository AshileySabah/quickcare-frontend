<div class="awaiting-validation">
  <header class="awaiting-validation__header">
    <div>
      <p class="awaiting-validation__brand">QuickCare</p>
      <h1 class="awaiting-validation__title">Validação do seu cadastro</h1>
      <p class="awaiting-validation__subtitle">
        Olá, {{ userName() }}. Você poderá ver solicitações e enviar propostas assim que todas as etapas forem aprovadas.
      </p>
    </div>
    <ui-button variant="ghost" size="sm" (click)="logout()">Sair</ui-button>
  </header>

  <app-my-validation profile="professional"></app-my-validation>
</div>
