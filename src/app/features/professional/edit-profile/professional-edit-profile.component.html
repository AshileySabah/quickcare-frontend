<section class="edit-profile">
  <header class="edit-profile__header">
    <h1 class="edit-profile__title">Meu perfil</h1>
    <p class="edit-profile__subtitle">Mantenha suas informações e sua forma de atendimento atualizadas.</p>
    <p class="edit-profile__note">{{ lockedNote }}</p>
  </header>

  @switch (state()) {
    @case ('loading') {
      <ui-skeleton-list variant="form"></ui-skeleton-list>
    }
    @case ('error') {
      <ui-error-state [message]="loadError()" (retry)="load()"></ui-error-state>
    }
    @case ('ready') {
      <form class="edit-profile__sections" [formGroup]="form" (ngSubmit)="submit()" autocomplete="off">
        <ui-avatar-upload [initialUrl]="avatarUrl()" (avatarChange)="onAvatarChange($event)"></ui-avatar-upload>

        <ui-basic-info-card
          [group]="form"
          [fieldError]="fieldError"
          [showEmail]="false"
          [showCpf]="false"
          [showBirthDate]="false"
          [showGender]="false"
        ></ui-basic-info-card>

        <ui-professional-practice-card
          [group]="form"
          [fieldError]="fieldError"
          [categoryOptions]="categoryOptions()"
          [specialtyOptions]="specialtyOptions()"
          [ufOptions]="ufOptions()"
          [isOutro]="isOutro()"
          [requiresRegistration]="requiresRegistration()"
          [registrationLabel]="registrationLabel()"
          [modalityError]="modalityError"
        ></ui-professional-practice-card>

        <ui-emergency-contacts-card [formArray]="form.controls.emergencyContacts"></ui-emergency-contacts-card>

        <ui-address-card [group]="form.controls.address" [fieldError]="addressFieldError"></ui-address-card>

        <ui-declarations-card [group]="form" [fieldError]="fieldError">
          <ui-checkbox
            label="Possuo seguro de responsabilidade civil profissional"
            formControlName="hasLiabilityInsurance"
          ></ui-checkbox>
        </ui-declarations-card>

        <div class="edit-profile__actions">
          <ui-button type="submit" [loading]="isSubmitting()">Salvar alterações</ui-button>
        </div>
      </form>
    }
  }
</section>
