<section class="proposal-edit">
  <h1 class="proposal-edit__title">Editar proposta</h1>
  <p class="proposal-edit__subtitle">Atualize os dados da sua proposta.</p>

  @if (proposal(); as current) {
    <app-proposal-form
      [initialValue]="current"
      submitLabel="Salvar alterações"
      [submitting]="isSubmitting()"
      (submitted)="save($event)"
    ></app-proposal-form>
  } @else {
    <ui-skeleton-list variant="page"></ui-skeleton-list>
  }
</section>
