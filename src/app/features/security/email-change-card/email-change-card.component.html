<ui-card>
  <h2 class="security-card__title">E-mail</h2>
  <p class="security-card__text">
    Seu e-mail atual é <strong>{{ currentEmail() }}</strong>. Para trocar, confirme com um código enviado ao novo
    endereço.
  </p>

  @if (step() === 'request') {
    <form class="security-card__form" [formGroup]="requestForm" (ngSubmit)="requestCode()" autocomplete="off">
      <ui-input
        label="Novo e-mail"
        type="email"
        formControlName="newEmail"
        autocomplete="email"
        [required]="true"
        [maxLength]="150"
        [errorMessage]="requestError('newEmail')"
      ></ui-input>
      <ui-input
        label="Senha atual"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        [revealable]="true"
        [required]="true"
        [maxLength]="72"
        [errorMessage]="requestError('password')"
      ></ui-input>
      <div class="security-card__actions">
        <ui-button type="submit" [loading]="loading()">Enviar código</ui-button>
      </div>
    </form>
  } @else {
    <form class="security-card__form" [formGroup]="codeForm" (ngSubmit)="confirm()" autocomplete="off">
      <p class="security-card__text">
        Enviamos um código de 6 números para <strong>{{ pendingEmail() }}</strong>. Ele vale por 10 minutos.
      </p>
      <ui-input
        label="Código"
        formControlName="code"
        autocomplete="one-time-code"
        [required]="true"
        [maxLength]="6"
        [errorMessage]="codeError('code')"
      ></ui-input>
      <div class="security-card__actions">
        <ui-button variant="secondary" [disabled]="loading()" (click)="restart()">Trocar o e-mail digitado</ui-button>
        <ui-button type="submit" [loading]="loading()">Confirmar novo e-mail</ui-button>
      </div>
    </form>
  }
</ui-card>
