<ui-card>
  <h2 class="security-card__title">Senha</h2>
  <p class="security-card__text">
    Ao trocar a senha, as sessões abertas em outros dispositivos são encerradas. Este dispositivo continua conectado.
  </p>

  <form class="security-card__form" [formGroup]="form" (ngSubmit)="submit()" autocomplete="off">
    <ui-input
      label="Senha atual"
      type="password"
      formControlName="currentPassword"
      autocomplete="current-password"
      [revealable]="true"
      [required]="true"
      [maxLength]="72"
      [errorMessage]="fieldError('currentPassword')"
    ></ui-input>
    <ui-password-fields
      [group]="form"
      passwordLabel="Nova senha"
      confirmLabel="Confirmar nova senha"
      [passwordError]="fieldError('password')"
      [confirmPasswordError]="confirmPasswordError()"
    ></ui-password-fields>
    <div class="security-card__actions">
      <ui-button type="submit" [loading]="loading()">Salvar nova senha</ui-button>
    </div>
  </form>
</ui-card>
