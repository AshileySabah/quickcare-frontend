<form class="resubmit-form" [formGroup]="form" (ngSubmit)="submit()">
  <p class="resubmit-form__title">{{ title() }}</p>
  @if (note(); as text) {
    <p class="resubmit-form__note">{{ text }}</p>
  }

  <ui-grid>
    @switch (type()) {
      @case ('CPF') {
        <ui-grid-item [xs]="12" [sm]="6">
          <ui-input label="CPF" formControlName="cpf" mask="cpf" [required]="true" [errorMessage]="fieldError('cpf')"></ui-input>
        </ui-grid-item>
      }
      @case ('IDENTIDADE') {
        <ui-grid-item [xs]="12" [sm]="6">
          <ui-select
            label="Documento de identidade"
            formControlName="identityDocumentType"
            [options]="identityDocumentOptions"
            [required]="true"
            [errorMessage]="fieldError('identityDocumentType')"
          ></ui-select>
        </ui-grid-item>
        <ui-grid-item [xs]="12" [sm]="isRg ? 6 : 12">
          <ui-input
            label="Número do documento"
            formControlName="identityDocumentNumber"
            hint="Só números (e X, se houver)."
            [required]="true"
            [maxLength]="20"
            [errorMessage]="fieldError('identityDocumentNumber')"
          ></ui-input>
        </ui-grid-item>
        @if (isRg) {
          <ui-grid-item [xs]="12" [sm]="6">
            <ui-select
              label="UF emissora"
              formControlName="identityDocumentUf"
              [options]="ufOptions()"
              [required]="true"
              [errorMessage]="fieldError('identityDocumentUf')"
            ></ui-select>
          </ui-grid-item>
        }
        <ui-grid-item [xs]="12" [sm]="6">
          <ui-input
            label="Data de nascimento"
            type="date"
            formControlName="birthDate"
            [max]="latestBirthDate"
            [required]="true"
            [errorMessage]="fieldError('birthDate')"
          ></ui-input>
        </ui-grid-item>
        <ui-grid-item [xs]="12" [sm]="6">
          <ui-select
            label="Gênero"
            formControlName="gender"
            [options]="genderOptions"
            [required]="true"
            placeholder="Selecione"
            [errorMessage]="fieldError('gender')"
          ></ui-select>
        </ui-grid-item>
      }
      @case ('CNPJ') {
        <ui-grid-item [xs]="12" [sm]="6">
          <ui-input label="CNPJ" formControlName="cnpj" mask="cnpj" [required]="true" [errorMessage]="fieldError('cnpj')"></ui-input>
        </ui-grid-item>
      }
      @case ('REGISTRO_PROFISSIONAL') {
        <ui-grid-item [xs]="12" [sm]="6">
          <ui-input
            [label]="registrationLabel()"
            formControlName="registrationNumber"
            [required]="true"
            [maxLength]="50"
            [errorMessage]="fieldError('registrationNumber')"
          ></ui-input>
        </ui-grid-item>
        <ui-grid-item [xs]="12" [sm]="6">
          <ui-select
            label="UF do registro"
            formControlName="registrationUf"
            [options]="ufOptions()"
            [required]="true"
            [errorMessage]="fieldError('registrationUf')"
          ></ui-select>
        </ui-grid-item>
      }
    }

    <ui-grid-item [xs]="12">
      <ui-file-replacer
        label="Documento"
        [current]="step()?.document ?? null"
        [required]="true"
        [disabled]="isSubmitting()"
        [errorMessage]="documentError()"
        (fileChange)="onDocumentChange($event)"
      ></ui-file-replacer>
    </ui-grid-item>
  </ui-grid>

  <div class="resubmit-form__actions">
    @if (step()?.status !== 'reprovada') {
      <ui-button variant="secondary" [disabled]="isSubmitting()" (click)="cancelled.emit()">Cancelar</ui-button>
    }
    <ui-button type="submit" [loading]="isSubmitting()">Enviar para validação</ui-button>
  </div>
</form>

<ui-confirm-dialog
  [open]="confirmingUnchanged()"
  titleText="Nada mudou"
  icon="alert"
  message="Parece que nada mudou. Enviar para validação mesmo assim?"
  [consequences]="unchangedConsequences"
  confirmLabel="Sim, enviar para validação"
  cancelLabel="Não, continuar editando"
  (confirmed)="confirmUnchanged()"
  (closed)="confirmingUnchanged.set(false)"
></ui-confirm-dialog>
