<ui-modal size="lg" [open]="open()" [titleText]="titleText()" (closed)="close()">
  <div class="confirm-dialog__body">
    @if (icon(); as name) {
      <span class="confirm-dialog__icon" [class.confirm-dialog__icon--danger]="confirmVariant() === 'danger'">
        <ui-icon [name]="name" [size]="22"></ui-icon>
      </span>
    }
    <div class="confirm-dialog__text">
      <p class="confirm-dialog__message">{{ message() }}</p>
      @if (consequences().length > 0) {
        <ul class="confirm-dialog__consequences">
          @for (consequence of consequences(); track consequence) {
            <li>{{ consequence }}</li>
          }
        </ul>
      }
      <!-- Campos extras da confirmação (ex.: o novo período da remarcação). -->
      <ng-content></ng-content>
    </div>
  </div>

  <div class="confirm-dialog__actions">
    <ui-button [variant]="cancelVariant()" [fullWidth]="true" [disabled]="loading()" (click)="close()">
      {{ cancelLabel() }}
    </ui-button>
    <ui-button [variant]="confirmVariant()" [fullWidth]="true" [loading]="loading()" (click)="confirmed.emit()">
      {{ confirmLabel() }}
    </ui-button>
  </div>
</ui-modal>
