<div class="ui-file-picker">
  <span class="ui-file-picker__label">{{ label() }}</span>

  @for (file of files(); track $index) {
    <div class="ui-file-picker__selected">
      <span class="ui-file-picker__file-name">{{ file.name }}</span>
      <span class="ui-file-picker__file-size">{{ sizeLabel(file) }}</span>
      <button type="button" class="ui-file-picker__remove" [disabled]="disabled()" (click)="remove($index)">
        Remover
      </button>
    </div>
  }

  @if (!full()) {
    <label class="ui-file-picker__button" [class.ui-file-picker__button--disabled]="disabled()" [for]="inputId">
      + Escolher {{ files().length ? 'outro arquivo' : 'arquivos' }}
      <input
        class="ui-file-picker__input"
        [id]="inputId"
        type="file"
        multiple
        [accept]="accept"
        [disabled]="disabled()"
        (change)="onFilesSelected($event)"
      />
    </label>
  }

  @if (localError(); as error) {
    <p class="ui-file-picker__error" role="alert">{{ error }}</p>
  } @else {
    <p class="ui-file-picker__hint">{{ hintText() }}</p>
  }
</div>
