<div class="ui-input">
  <label class="ui-input__label" [for]="inputId">
    {{ label() }}
    @if (required()) {
      <span aria-hidden="true">*</span>
    }
  </label>
  <input
    class="ui-input__field"
    [class.ui-input__field--error]="errorMessage()"
    [id]="inputId"
    [type]="type()"
    [placeholder]="placeholder()"
    [value]="value()"
    [disabled]="disabled()"
    [required]="required()"
    [attr.aria-invalid]="errorMessage() ? true : null"
    [attr.aria-describedby]="errorMessage() ? errorId : (hint() ? hintId : null)"
    (input)="onInput($event)"
    (blur)="onBlur()"
  />
  @if (errorMessage()) {
    <p class="ui-input__error" [id]="errorId" role="alert">{{ errorMessage() }}</p>
  } @else if (hint()) {
    <p class="ui-input__hint" [id]="hintId">{{ hint() }}</p>
  }
</div>
