<div class="app-shell">
  <header class="app-shell__header">
    <a class="app-shell__brand" [routerLink]="homeLink()">{{ brandLabel() }}</a>

    <nav class="app-shell__nav" [attr.aria-label]="navLabel()">
      @for (item of navItems(); track item.link) {
        <a
          class="app-shell__link"
          [routerLink]="item.link"
          routerLinkActive="app-shell__link--active"
          [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
          >{{ item.label }}
          @if (item.count) {
            <span class="app-shell__count" [attr.aria-label]="item.count + ' aguardando'">{{ item.count }}</span>
          }
        </a>
      }
    </nav>

    <div class="app-shell__user">
      <ui-profile-switcher></ui-profile-switcher>
      <ui-notification-bell></ui-notification-bell>
      <ui-user-menu
        [profileLink]="profileLink()"
        [documentsLink]="documentsLink()"
        [blockedUsersLink]="blockedUsersLink()"
      ></ui-user-menu>
    </div>
  </header>

  <main class="app-shell__content">
    <ng-content></ng-content>
  </main>
</div>
