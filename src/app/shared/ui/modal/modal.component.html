@if (open()) {
  <div class="ui-modal__backdrop" (click)="onBackdropClick()">
    <div
      class="ui-modal__dialog"
      #dialog
      role="dialog"
      aria-modal="true"
      [attr.aria-labelledby]="titleId"
      tabindex="-1"
      (click)="$event.stopPropagation()"
      (keydown)="onKeydown($event)"
    >
      <div class="ui-modal__header">
        <h2 class="ui-modal__title" [id]="titleId">{{ titleText() }}</h2>
        <button
          class="ui-modal__close"
          type="button"
          aria-label="Fechar"
          (click)="close()"
        >
          &times;
        </button>
      </div>
      <div class="ui-modal__body">
        <ng-content></ng-content>
      </div>
    </div>
  </div>
}
