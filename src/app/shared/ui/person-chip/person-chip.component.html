<ng-template #content>
  <ui-avatar
    [name]="displayName()"
    [imageUrl]="unavailable() ? undefined : avatarUrl()"
    [unavailable]="unavailable()"
  ></ui-avatar>
  <span class="person-chip__text">
    <span class="person-chip__name" [class.person-chip__name--unavailable]="unavailable()">{{ displayName() }}</span>
    @if (caption()) {
      <span class="person-chip__caption">{{ caption() }}</span>
    }
  </span>
</ng-template>

@if (target(); as route) {
  <a class="person-chip person-chip--link" [routerLink]="route" [attr.aria-label]="'Ver perfil de ' + displayName()">
    <ng-container [ngTemplateOutlet]="content"></ng-container>
  </a>
} @else {
  <span class="person-chip">
    <ng-container [ngTemplateOutlet]="content"></ng-container>
  </span>
}
