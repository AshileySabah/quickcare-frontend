<ui-card>
  <header class="profile-card__header">
    <ui-avatar size="lg" [name]="name()" [imageUrl]="avatarUrl()"></ui-avatar>
    <div class="profile-card__identity">
      <h1 class="profile-card__name">{{ name() }}</h1>
      @if (subtitle()) {
        <p class="profile-card__subtitle">{{ subtitle() }}</p>
      }
    </div>
    <div class="profile-card__actions">
      <ng-content select="[profile-actions]"></ng-content>
    </div>
  </header>

  @if (details().length > 0) {
    <dl class="profile-card__details">
      @for (detail of details(); track detail.label) {
        <div>
          <dt>{{ detail.label }}</dt>
          <dd>{{ detail.value }}</dd>
        </div>
      }
    </dl>
  }

  @if (ratings(); as summary) {
    <div class="profile-card__ratings">
      <ui-rating-summary [summary]="summary"></ui-rating-summary>
    </div>
  }
</ui-card>
