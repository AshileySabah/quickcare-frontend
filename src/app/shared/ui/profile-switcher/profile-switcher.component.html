@if (hasBothProfiles()) {
  <div class="profile-switcher" role="group" aria-label="Perfil em uso">
    @for (option of options; track option.role) {
      <button
        type="button"
        class="profile-switcher__option"
        [class.profile-switcher__option--active]="option.role === currentRole()"
        [attr.aria-pressed]="option.role === currentRole()"
        [disabled]="switching() || isBanned(option.role)"
        (click)="select(option.role)"
      >
        {{ option.label }}
        @if (isBanned(option.role)) {
          <span class="profile-switcher__banned">banido</span>
        } @else if (option.role !== currentRole() && otherUnread() > 0) {
          <span
            class="profile-switcher__unread"
            [attr.aria-label]="otherUnread() === 1 ? '1 notificação não lida' : otherUnread() + ' notificações não lidas'"
            >{{ otherUnread() > 99 ? '99+' : otherUnread() }}</span
          >
        }
      </button>
    }
  </div>
}
