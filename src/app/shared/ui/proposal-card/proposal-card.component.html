<ui-card class="ui-proposal-card">
  <header class="ui-proposal-card__header">
    @if (personName(); as name) {
      <ui-person-chip [name]="name" [avatarUrl]="personAvatarUrl()" [link]="personLink()"></ui-person-chip>
    } @else if (personHiddenNote()) {
      <p class="ui-proposal-card__hidden-note">{{ personHiddenNote() }}</p>
    }
    <ui-status-badge class="ui-proposal-card__status" kind="proposal" [status]="proposal().status"></ui-status-badge>
  </header>

  @if (subtitle()) {
    <p class="ui-proposal-card__subtitle">{{ subtitle() }}</p>
  }

  @if (notice()) {
    <ui-notice>{{ notice() }}</ui-notice>
  }

  <p class="ui-proposal-card__price">{{ proposal().price | currency: 'BRL' }}</p>

  <p class="ui-proposal-card__approach">{{ proposal().approach }}</p>

  <p class="ui-proposal-card__deadline">Prazo: {{ proposal().deadline | date: 'dd/MM/yyyy' }}</p>

  <div class="ui-proposal-card__actions">
    <ng-content select="[proposal-actions]"></ng-content>
  </div>
</ui-card>
